.qisma-button:hover{transform:translateY(-1px);box-shadow:0 7px 17px rgba(15,58,45,.13)}
.qisma-button:active{transform:translateY(0) scale(.98)}
.qisma-button-primary{background:var(--qx-green)!important;box-shadow:0 7px 18px rgba(23,106,80,.2)}
.qisma-button-primary:hover{filter:brightness(.96);opacity:1!important}
.qisma-button-soft{background:#eaf3ee!important}
.qisma-input{border-color:#cedfd7!important;box-shadow:inset 0 1px 2px rgba(15,58,45,.025);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease!important}
.qisma-input:hover{border-color:#aac8ba!important}
.qisma-input:focus{border-color:var(--qx-green)!important;box-shadow:0 0 0 3px rgba(23,106,80,.11)!important;background:#fff!important}
.qisma-modal-backdrop{background:rgba(5,35,27,.58)!important;backdrop-filter:blur(8px)!important;-webkit-backdrop-filter:blur(8px)!important}
.qisma-modal{border:1px solid rgba(255,255,255,.5);box-shadow:0 28px 70px rgba(5,35,27,.25)!important}
header.sticky{background:rgba(248,251,250,.88)!important;border-color:rgba(195,216,206,.8)!important;box-shadow:0 4px 22px rgba(15,58,45,.045)}
aside{box-shadow:-8px 0 32px rgba(5,35,27,.12)}
.qisma-chip{border:1px solid #d9e9e1}
.qisma-kicker{color:#668c7d!important;font-weight:800!important}
[data-testid^="card-heir-"],[data-testid^="card-property-"]{position:relative}
[data-testid^="card-heir-"]::before,[data-testid^="card-property-"]::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:linear-gradient(90deg,var(--qx-gold),#efd060 32%,var(--qx-green) 82%)}
[data-testid^="button-open-mobile-menu"]{box-shadow:0 4px 12px rgba(15,58,45,.08)}
nav.fixed{padding-bottom:max(.5rem,env(safe-area-inset-bottom))!important;border-color:#d7e6df!important;box-shadow:0 -8px 28px rgba(15,58,45,.09)!important}
.qisma-toast{background:var(--qx-green-deep)!important;border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 30px rgba(5,35,27,.28)!important}
#qbk button{font-family:Tajawal,system-ui,sans-serif!important;border-color:#c9ddd3!important;box-shadow:0 6px 18px rgba(15,58,45,.12)!important;font-weight:700}
@media (min-width:769px){.qisma-card:hover{transform:translateY(-2px);box-shadow:var(--qx-shadow-hover)!important;border-color:#bed8cc!important}}
@media (max-width:768px){
 body{background:#f5faf7!important}
 header.sticky{min-height:70px!important;padding-left:14px!important;padding-right:14px!important;gap:10px!important}
 header.sticky [data-testid="link-mobile-brand"]{flex-shrink:0}
 header.sticky [data-testid="link-mobile-brand"]>span:last-child{font-size:17px}
 .qisma-card{border-radius:16px!important;box-shadow:0 7px 22px rgba(15,58,45,.065)!important}
 .qisma-button{border-radius:12px!important}
 main{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
 nav.fixed{margin:0 8px 8px;border:1px solid #d9e7e0!important;border-radius:18px!important;inset-inline:8px!important;overflow:hidden;background:rgba(255,255,255,.94)!important}
 nav.fixed a{border-radius:13px!important;min-width:0!important;transition:background .18s ease,color .18s ease!important}
 nav.fixed a span{line-height:1.25!important}
 .qisma-modal{border-radius:24px 24px 0 0!important;box-shadow:0 -18px 55px rgba(5,35,27,.24)!important}
 .qx-bar{border-color:#b9d3c6!important;background:#f0f7f3!important;border-radius:14px!important}
 [data-testid^="card-heir-"] [data-qx],[data-testid^="card-property-"] [data-qx]{color:#4d7b6c!important}
 h1{letter-spacing:0!important;line-height:1.3!important}
}
